<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>その先を、持ち寄る。｜IFbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Poppins:wght@600;700&display=swap">
<style>
  :root{--navy:#0E2A5B;--navy-deep:#07152F;--gold:#F6A623;--ink-w:rgba(255,255,255,.86);
        --body:'Noto Sans JP',system-ui,sans-serif;--latin:'Poppins',sans-serif}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--navy-deep);color:#fff;font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  p{margin:0}

  .strip{position:fixed;left:0;right:0;top:0;height:3px;z-index:11;background:rgba(255,255,255,.12)}
  .strip i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}

  .top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:12px;
       padding:12px 16px;background:linear-gradient(180deg,rgba(7,21,47,.92),rgba(7,21,47,0));pointer-events:none}
  .top a,.top .t{pointer-events:auto}
  .top .home{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font-family:var(--latin);font-weight:700;font-size:16px}
  .top .home svg{width:26px;height:26px}
  .top .t{margin-left:auto;font-size:12px;color:var(--ink-w)}
  .top #nav{font-family:var(--latin);font-size:12px;color:var(--gold);font-weight:600}

  .viewer{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;
          scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .viewer::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100vw;width:100vw;height:100%;padding:0 24px;scroll-snap-align:start;scroll-snap-stop:always;
         display:flex;align-items:center;justify-content:center;position:relative}
  .slide img{max-width:100%;max-height:calc(100vh - 84px);width:auto;height:auto;display:block;
             box-shadow:0 14px 44px rgba(0,0,0,.5);border-radius:4px}
  .slide.text{padding:72px 20px 56px;overflow:auto}
  .slide.text .in{max-width:640px;width:100%;text-align:center}
  .slide.text .eb{font-family:var(--latin);font-size:12px;font-weight:600;letter-spacing:.28em;color:var(--gold)}
  .slide.text h1{margin:14px 0 0;font-size:clamp(24px,5vw,38px);font-weight:900;line-height:1.45}
  .slide.text p{margin-top:14px;font-size:15px;color:var(--ink-w);line-height:2}
  .slide.text .meta{margin-top:16px;font-size:12.5px;color:rgba(255,255,255,.6)}
  .slide.text .cta{display:inline-flex;align-items:center;gap:8px;margin-top:26px;background:var(--gold);
                   color:var(--navy);font-weight:700;text-decoration:none;padding:13px 26px;border-radius:9px;font-size:15px}
  .slide.text .sub{display:inline-block;margin-top:14px;font-size:13px;color:var(--ink-w);text-decoration:underline}

  .arw{position:fixed;top:50%;transform:translateY(-50%);z-index:9;width:44px;height:44px;border-radius:50%;
       border:1px solid rgba(255,255,255,.3);background:rgba(7,21,47,.55);color:#fff;font-size:19px;
       display:grid;place-items:center;cursor:pointer;font-family:inherit}
  .arw:hover{background:var(--gold);color:var(--navy);border-color:transparent}
  #prev{left:14px}#next{right:14px}
  .hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;font-size:11px;
        color:rgba(255,255,255,.7);background:rgba(7,21,47,.6);padding:5px 12px;border-radius:999px;
        pointer-events:none;transition:opacity .4s}
  @media (max-width:700px){.arw{display:none}.slide img{max-height:calc(100vh - 70px)}}
</style>
</head>
<body>

<div class="strip"><i id="bar"></i></div>
<div class="top">
  <a class="home" href="../">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="2.5" y="2.5" width="35" height="35" rx="9.5" fill="#F6A623"/><circle cx="8.6" cy="8.6" r="2.1" fill="#0E2A5B"/><circle cx="31.4" cy="8.6" r="2.1" fill="#0E2A5B"/><circle cx="8.6" cy="31.4" r="2.1" fill="#0E2A5B"/><circle cx="31.4" cy="31.4" r="2.1" fill="#0E2A5B"/><rect x="12.1" y="11" width="5.3" height="18" rx="2.3" fill="#fff"/><rect x="20.5" y="11" width="5.3" height="18" rx="2.3" fill="#fff"/><rect x="20.5" y="11" width="8.8" height="5.3" rx="2.3" fill="#fff"/><rect x="20.5" y="18.7" width="6.7" height="4.9" rx="2.2" fill="#fff"/></svg>
    IFbox
  </a>
  <span class="t">その先を、持ち寄る。</span>
  <span id="nav"></span>
</div>

<div class="viewer" id="viewer">
  <section class="slide text" id="intro"><div class="in">
    <p class="eb">Story</p>
    <h1>その先を、持ち寄る。</h1>
    <p>夜と週末に何か作っている人が、思いついたものを一行だけ置く。別の街にいた二人が乗ってくる。三人が出会って、見知らぬ台所で使われるまで。</p>
    <p class="meta">全11ページ ・ 約3分で読めます ・ 作画はAI</p>
  </div></section>

  <section class="slide text" id="end"><div class="in">
    <p class="eb">The end</p>
    <h1>あなたの“もし”も、<br>置いていけます。</h1>
    <p>整った企画書はいりません。ひとことで構いません。<br>置いておけば、面白がった人が乗ってきます。</p>
    <a class="cta" href="../#post">“もし”を置いてみる →</a>
    <a class="sub" href="../story/">同じ話を、72秒の映像で見る</a>
  </div></section>
</div>

<button class="arw" id="prev" aria-label="前のページ">‹</button>
<button class="arw" id="next" aria-label="次のページ">›</button>
<div class="hint" id="hint">← → キー、またはスワイプでめくれます</div>

<script>
(function(){
  var N=11, v=document.getElementById('viewer'), end=document.getElementById('end');
  for(var i=1;i<=N;i++){
    var n=('0'+i).slice(-2);
    var s=document.createElement('section'); s.className='slide';
    s.innerHTML='<img src="pages/p'+n+'.jpg" alt="ページ'+i+'"'+(i>2?' loading="lazy"':'')+'>';
    v.insertBefore(s,end);
  }
  var slides=v.querySelectorAll('.slide'), bar=document.getElementById('bar'), nav=document.getElementById('nav');
  function idx(){ return Math.round(v.scrollLeft / v.clientWidth); }
  function go(i){ i=Math.max(0,Math.min(slides.length-1,i)); v.scrollTo({left:i*v.clientWidth,behavior:'smooth'}); }
  function upd(){
    var i=idx();
    bar.style.width=(i/(slides.length-1)*100)+'%';
    nav.textContent = (i===0) ? '' : (i>N ? 'END' : i+' / '+N);
  }
  v.addEventListener('scroll',upd,{passive:true});
  window.addEventListener('resize',upd);
  document.getElementById('prev').onclick=function(){go(idx()-1);};
  document.getElementById('next').onclick=function(){go(idx()+1);};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(idx()+1);}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(idx()-1);}
  });
  setTimeout(function(){var h=document.getElementById('hint');if(h)h.style.opacity=0;},4500);
  upd();
})();
</script>
</body>
</html>
